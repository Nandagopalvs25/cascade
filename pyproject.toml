[project]
name = "cascade"
version = "0.1.0"
description = "Autonomous computational chemistry coordinator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "google-auth[requests]>=2.35",
    "google-cloud-pubsub>=2.28",
    "google-cloud-storage>=2.18",
    "httpx>=0.27",
    "google-adk[db]>=2.7,<2.8",
    "google-cloud-run>=0.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", "*.md"]
src = ["src", "workloads/dock"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["cascade"]

[tool.ruff.format]
quote-style = "double"
